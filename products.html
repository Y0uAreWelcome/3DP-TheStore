<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T02Y4NC32Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T02Y4NC32Z');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Print Forge | Products</title>

    <link rel="icon" type="image/x-icon" href="https://3dpstore.us.com/favicon.ico">
<link rel="icon" type="image/png" sizes="48x48" href="https://3dpstore.us.com/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="https://3dpstore.us.com/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://3dpstore.us.com/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://3dpstore.us.com/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://3dpstore.us.com/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://3dpstore.us.com/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://3dpstore.us.com/android-chrome-512x512.png">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div id="site-nav"></div>
    <div id="cart-root"></div>

    <main id="main-content" class="page-container">
        <div class="page-heading">
            <h1 class="page-title">Our 3D Printing Catalog</h1>
            <p class="page-intro">Browse current FPV parts, storage solutions, and a preview of new prints coming soon.</p>
        </div>

        <!-- Dynamic Product Section -->
        <section class="product-section" id="fpv-parts" aria-labelledby="fpv-parts-title">
            <h2 id="fpv-parts-title">Catalog Items</h2>
            <div class="product-grid" id="product-grid">
                <p>Loading products from database...</p>
            </div>
        </section>

        <section class="product-section" id="more-products" aria-labelledby="more-products-title">
            <h2 id="more-products-title">More Products Coming Soon</h2>
            <div class="product-grid">
                <div class="product-card large-placeholder">
                    <div class="product-image">
                        <img src="comingSoonR&D.jpg" alt="Coming soon research and development product preview" loading="lazy">
                    </div>
                    <h3>Featured Product Preview</h3>
                    <p class="price">Coming soon</p>
                </div>
            </div>
        </section>
    </main>

    <script src="nav.js"></script>
    <script src="cart.js"></script>

    <!-- Supabase Dynamic Loader Script -->
    <script>
        const supabaseUrl = 'https://tvvoimrcezxwjhlaykhf.supabase.co'
        const supabaseKey = 'sb_publishable_E5jKhI2kNpzPSUafsI3IIw_D3UT06k-'
        const client = supabase.createClient(supabaseUrl, supabaseKey)

        async function loadStoreProducts() {
            const grid = document.getElementById('product-grid')
            
            // Fetch everything from your database table
            const { data: products, error } = await client.from('products').select('*')

            if (error) {
                console.error('Error fetching products:', error)
                grid.innerHTML = '<p>Error loading products from database.</p>'
                return
            }

            if (!products || products.length === 0) {
                grid.innerHTML = '<p>No products found in database.</p>'
                return
            }

            // Clear loading message
            grid.innerHTML = ''

            // Loop through each item in Supabase and build the card
            products.forEach(product => {
                const generatedId = product.name.toLowerCase().replace(/[^a-z0-9]/g, '-');
                const safeName = product.name.replace(/"/g, '&quot;');

                const cardHTML = `
                    <div class="product-card">
                        <div class="product-image">
                            <img src="${product.image_url || 'RDimg4.jpg'}" alt="${safeName}" loading="lazy">
                        </div>
                        <h3>${product.name}</h3>
                        <p class="price">$${Number(product.price).toFixed(2)}</p>
                        <p>${product.description || 'Custom 3D printed part.'}</p>
                        <button class="btn add-to-cart" type="button" 
                            data-add-to-cart 
                            data-product-id="${generatedId}" 
                            data-product-name="${safeName}" 
                            data-product-price="${product.price}"
                            data-product-description="${product.description || ''}">
                            Add to Cart
                        </button>
                    </div>
                `
                grid.innerHTML += cardHTML
            })
        }

        loadStoreProducts()
    </script>
</body>
</html>
